services:
  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./sessions:/app/.sessions
    environment:
      WHATSAPP_HOOK_URL: http://webhook:8080/waha
      WHATSAPP_HOOK_EVENTS: message
  
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: waha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: waha_app
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waha -d waha_app"]
      interval: 5s
      retries: 10

  webhook:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://waha:${POSTGRES_PASSWORD}@postgres:5432/waha_app
    command: python3 app.py
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  processador:
    build: .
    command: python3 processador.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://waha:${POSTGRES_PASSWORD}@postgres:5432/waha_app
    depends_on:
      postgres:
        condition: service_healthy